<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .grid-line { stroke: #181818; stroke-width: 1; }
      .box { fill: #111111; stroke: #262626; stroke-width: 1.5; rx: 4px; }
      .box-active { fill: #141414; stroke: #00FF66; stroke-width: 1.5; rx: 4px; }
      .text-title { font-family: 'SF Mono', 'Courier New', monospace; font-size: 13px; fill: #FFFFFF; font-weight: bold; letter-spacing: 1px; }
      .text-sub { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #888888; }
      .text-accent { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #00FF66; }
      .line { stroke: #333333; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .line-solid { stroke: #00FF66; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" class="bg" />
  
  <!-- Grid Lines -->
  <line x1="0" y1="80" x2="1000" y2="80" class="grid-line" />
  <line x1="0" y1="400" x2="1000" y2="400" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="480" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="480" class="grid-line" />

  <!-- Header -->
  <text x="40" y="50" class="text-title">// EXTENSION_ARCHITECTURE :: INDUSTRIAL_LOFI_PS</text>
  <text x="730" y="50" class="text-accent">[CEP 12.0 / PHSP 2020-2026]</text>

  <!-- UI CONTROLLER -->
  <rect x="40" y="150" width="200" height="180" class="box" />
  <text x="60" y="180" class="text-title">PANEL INTERFACES</text>
  <text x="60" y="205" class="text-sub">› CEP 12.0 HTML5 / CSS</text>
  <text x="60" y="225" class="text-sub">› Native ScriptUI (.jsx)</text>
  <text x="60" y="245" class="text-sub">› CSInterface JS Bridge</text>
  <text x="60" y="265" class="text-sub">› Realtime Parameter Sliders</text>
  <text x="60" y="285" class="text-accent">› Dual-Runtime Support</text>

  <!-- BRIDGE -->
  <line x1="240" y1="240" x2="300" y2="240" class="line-solid" />

  <!-- PROCEDURAL ENGINE -->
  <rect x="300" y="130" width="240" height="220" class="box-active" />
  <text x="320" y="160" class="text-title">ACTIONDESCRIPTOR ENGINE</text>
  <text x="320" y="185" class="text-accent">› host.jsx Dispatcher</text>
  <text x="320" y="210" class="text-sub">› 29+ Procedural Recipes</text>
  <text x="320" y="235" class="text-sub">› ActionDescriptor API</text>
  <text x="320" y="260" class="text-sub">› Non-Destructive Masks</text>
  <text x="320" y="285" class="text-sub">› Curves / Gradient Maps</text>
  <text x="320" y="310" class="text-accent">› Native GPU Acceleration</text>

  <!-- MODULE DISPATCH -->
  <line x1="540" y1="180" x2="600" y2="120" class="line" />
  <line x1="540" y1="240" x2="600" y2="240" class="line-solid" />
  <line x1="540" y1="300" x2="600" y2="360" class="line" />

  <!-- NOIR & SCAN -->
  <rect x="600" y="90" width="180" height="70" class="box" />
  <text x="615" y="115" class="text-title">NOIR &amp; XEROX</text>
  <text x="615" y="135" class="text-sub">Crushed Noir · Xerox Scan</text>

  <!-- THERMAL & HALFTONE -->
  <rect x="600" y="205" width="180" height="70" class="box-active" />
  <text x="615" y="230" class="text-title">THERMAL &amp; HALFTONE</text>
  <text x="615" y="250" class="text-accent">Predator Heatmap · Dot Screen</text>

  <!-- CMYK & GLITCH -->
  <rect x="600" y="325" width="180" height="70" class="box" />
  <text x="615" y="350" class="text-title">CMYK &amp; DISTRESS</text>
  <text x="615" y="370" class="text-sub">Misregistration · Highpass</text>

  <!-- PHOTOSHOP HOST -->
  <line x1="780" y1="240" x2="830" y2="240" class="line-solid" />

  <rect x="830" y="160" width="130" height="160" class="box" />
  <text x="845" y="190" class="text-title">PHSP HOST</text>
  <text x="845" y="215" class="text-sub">› CC 2020-2026</text>
  <text x="845" y="235" class="text-sub">› Smart Objects</text>
  <text x="845" y="255" class="text-sub">› Blend Modes</text>
  <text x="845" y="275" class="text-accent">› 16/32-Bit Color</text>

  <!-- FOOTER -->
  <text x="40" y="435" class="text-sub">CEP 12.0 + SCRIPTUI  |  29+ PROCEDURAL FX MODULES  |  INDUSTRIAL BRUTALIST AESTHETIC</text>
</svg>
